server.port=8080
springdoc.swagger-ui.path=/
api.version=v3

# SQL Server - produção
# Todas as informações devem ser fornecidas por variáveis de ambiente.
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA};encrypt=${DB_ENCRYPT:false};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}

# Em produção, o banco e as tabelas devem existir previamente.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
